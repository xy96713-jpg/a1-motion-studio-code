// 人物资料卡 (reference P12, P30, P31, P46, P47): a real portrait and the person's name and role, set by code; then, in

if ((S.layout || 'full') === 'full' && S.photoSize && S.photoSize[1] > S.photoSize[0] * .9) {

// (ghost: the huge name's colour, one per person on cards in a row: the reference's red Pan, blue-violet Guo)
if (S.ghost) for (const g of ['#ghost', '#ghost2']) $(g).style.color = S.ghost;
// torn, full (the reference's P12 / meta R08): the name large on its torn strip, the English name in red slanted across

// a plain line, the role grey text: meta-S7 review)
if (S.torn) { $('#tornname').innerHTML = M.torn(S.name, { size: S.layout === 'card' ? 96 : 132 }); /* no quotes round a name: who-S10 review */ $('#name').style.display = 'none'; $('#block').style.top = S.layout === 'card' ? '520px' : '545px'; if (S.layout !== 'card') document.body.classList.add('torn'); }
else $('#name').innerHTML = `<span class="cond">${M.chars(S.name)}</span>`;
$('#en').textContent = S.en || ''; $('#role').textContent = S.role || ''; $('#bio').textContent = S.bio || '';
// the role's strip is a paper prop (labels.mjs), not a clipped rectangle; its shadow follows the paper's edge
if (S.torn && S.layout !== 'card') { const pl = M.plate(0, '#f1efea'); if (pl) { const r = $('#role'); r.style.cssText += pl + 'clip-path:none;box-shadow:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));padding:10px 34px 14px;'; } }
const big = (text, words) => { let h = M.esc(text); for (const w of words || []) h = h.replace(M.esc(w), `<b>${M.esc(w)}</b>`); return h; };
const SAY = (S.say || []).map((l) => { const el = document.createElement('div'); el.className = 'ln'; el.innerHTML = `<span class="t song cond">${big(l.text, l.big)}</span>`; $('#say').appendChild(el); return { el, l }; });
// a group wider than its column is set smaller to fit (meta-S5: 斯普特尼克时刻 ran off the card's right edge)
const fitSay = () => { const room = (S.layout === 'card' ? 1880 - 990 : 1100); for (const g of SAY) { const t = g.el.querySelector('.t'); const w = t.getBoundingClientRect().width; if (w > room) t.style.fontSize = `${104 * room / w}px`; } };
// the name, the Latin name, the role and the lines under it stacked by their ink, not their boxes (talent-S8: the
// serif name's glyphs reached down onto Ilya Sutskever; the checks measure the words, and so does this)
const stack = () => { if (S.layout === 'card') return; const els = ['#name', '#en', '#role', '#bio'].map((q) => $(q)).filter((e) => e && e.textContent.trim() && getComputedStyle(e).display !== 'none'), saved = els.map((e) => e.style.transform), r = document.createRange();
  els.forEach((e) => { e.style.transform = 'none'; });
  for (let i = 1; i < els.length; i++) { r.selectNodeContents(els[i - 1]); const a = r.getBoundingClientRect(); r.selectNodeContents(els[i]); const b = r.getBoundingClientRect(), d = a.bottom + 6 - b.top; if (d > 0) els[i].style.marginTop = `${parseFloat(getComputedStyle(els[i]).marginTop) + d}px`; }
  els.forEach((e, i) => { e.style.transform = saved[i]; }); };
// the name block off the face: on the photograph's other side when it would cover it (the module bench: a wider face
// set 馬克·安德森 over Andreessen's face; the reference lays the name on the empty half)
const offFace = () => { if (S.layout === 'card' || !S.faceN) return; const f = M.faceOn($('#photo')); const els = ['#block', '#tornname'].map((q) => $(q)).filter((e) => e.textContent.trim());
  const rs = els.map((e) => M.extent(e)).filter(Boolean); if (!f || !rs.some((r) => M.hits(r, f, 40))) return;
  const x0 = Math.min(...rs.map((r) => r.x)), y0 = Math.min(...rs.map((r) => r.y)), w = Math.max(...rs.map((r) => r.x + r.w)) - x0, h = Math.max(...rs.map((r) => r.y + r.h)) - y0;
  // where the block keeps most of its size: beside the face on the left or the right, or under it (a close-up fills the

  const left = { x: 140, y: y0, k: Math.min(1, (f.x - 40 - 140) / w) }, right = { k: Math.min(1, (1920 - 140 - (f.x + f.w + 40)) / w) }, under = { x: 140, y: f.y + f.h + 40, k: Math.min(1, (900 - (f.y + f.h + 40)) / h, (1920 - 280) / w) };
  right.x = 1920 - 140 - w * right.k; right.y = y0;
  const best = [left, right, under].sort((a, b) => b.k - a.k)[0]; if (best.k < .45) return;
  if (best === right) document.body.classList.add('flip');
  // (zoom scales the element's own place too: its offsets are set divided by it)
  els.forEach((e) => { const r = M.extent(e); if (!r) return; const dx = (r.x - x0) * best.k, dy = (r.y - y0) * best.k, cs = getComputedStyle(e), ox = r.x - parseFloat(cs.left), oy = r.y - parseFloat(cs.top);
    e.style.zoom = best.k; e.style.left = `${(best.x + dx - ox) / best.k}px`; e.style.top = `${(best.y + dy - oy) / best.k}px`; }); };
// the card's words centred on the photograph's middle (ending-S3/S4: the block sat at the top of the card)
const centreCard = () => { if (S.layout !== 'card' || S.torn) return; const b = $('#block'), ph = $('#photo'); const mid = ph.offsetTop + ph.offsetHeight / 2; b.style.top = `${Math.max(90, Math.min(670 - b.offsetHeight, mid - b.offsetHeight / 2))}px`; };   // (above the huge name at the foot: a role on its own line pushed the lines down onto DAYA, talent-S7)
// a full photograph whose face is small (a stage seen whole, a chair and the knees: talent-S10, meta-S8) is brought in
// on the face, as the reference's close-ups: the face about 400 px high on the right third, the photo still covering
// the frame (the camera would have taken the name in with it)
const closeUp = () => { if ((S.layout || 'full') !== 'full' || !S.faceN || !S.photoSize || S.photoSize[1] > S.photoSize[0] * .9) return;
  const el = $('#photo'), f = M.faceOn(el); if (!f || f.h >= 300) return;
  const r = el.getBoundingClientRect(), k = Math.min(2.2, 400 / f.h), W = r.width * k, H = r.height * k, cx = f.x + f.w / 2 - r.left, cy = f.y + f.h / 2 - r.top;
  const left = Math.min(0, Math.max(1920 - W, 1290 - cx * k)), top = Math.min(0, Math.max(1080 - H, 450 - cy * k));

// a card whose name leaves the role too little room beside it takes the role onto its own line, and a name wider than
// the card is set smaller to fit (the module bench: a ten-character role beside a long name ran off the frame)
const cardLine = () => { if (S.layout !== 'card') return; const nm = $('#name'), rl = $('#role'), w = nm.getBoundingClientRect().width;
  if (w > 880) nm.style.fontSize = `${parseFloat(getComputedStyle(nm).fontSize) * 880 / w}px`;
  rl.style.whiteSpace = 'nowrap';   /* (never a single character left on a second line: 者 alone, talent-S7) */
  if (rl.textContent.trim() && nm.getBoundingClientRect().width + 26 + rl.scrollWidth > 880) { Object.assign(rl.style, { gridColumn: '1 / 3', gridRow: '2', margin: '26px 0 0' }); $('#en').style.gridRow = '3'; $('#bio').style.gridRow = '4'; } };
// the huge ghost name keeps off the card's words (the frame checks read a look word strong enough to see as type:
// ending-S3's red ZIZHENG ran under 潘梓正): the top row rises until its letters' ink clears the words, the bottom row
// drops; each may run off the frame, as lettering laid as a pattern does
const ghostClear = () => { if (S.layout !== 'card') return; const ws = ['#block', '#tornname', '#say'].map((q) => $(q)).filter((e) => e && e.textContent.trim() && getComputedStyle(e).display !== 'none').map((e) => M.extent(e)).filter(Boolean); if (!ws.length) return;
  const top = Math.min(...ws.map((r) => r.y)), bot = Math.max(...ws.map((r) => r.y + r.h)), cx = document.createElement('canvas').getContext('2d'), gap = 14;
  const ink = (g) => { const cs = getComputedStyle(g), r = g.getBoundingClientRect(); cx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; const m = cx.measureText(g.textContent || 'M'), fa = m.fontBoundingBoxAscent, fd = m.fontBoundingBoxDescent, k = r.height / (fa + fd || 1); return { y0: r.top + (fa - m.actualBoundingBoxAscent) * k, y1: r.top + (fa + m.actualBoundingBoxDescent) * k }; };
  const g1 = $('#ghost'), g2 = $('#ghost2');
  if (g1.textContent.trim()) { const d = ink(g1).y1 - (top - gap); if (d > 0) g1.style.top = `${parseFloat(getComputedStyle(g1).top) - d}px`; }
  if (g2.textContent.trim()) { const d = (bot + gap) - ink(g2).y0; if (d > 0) g2.style.top = `${parseFloat(getComputedStyle(g2).top) + d}px`; } };

  const shown = SAY.filter((g) => t >= g.l.at), first = SAY[0]?.l.at ?? Infinity, back = M.E.inout(M.seg(t, first - .2, first + .3));
  SAY.forEach((g) => { if (t < g.l.at) { g.el.style.opacity = 0; return; } const k = M.E.out(M.seg(t, g.l.at, g.l.at + .4)), age = shown.length - 1 - shown.indexOf(g);

  for (const q of ['#block', '#tornname']) { $(q).style.opacity = 1 - .45 * back; $(q).style.translate = `0 ${-230 * back}px`; $(q).style.scale = `${1 - .4 * back}`; $(q).style.transformOrigin = '0 0'; }
  $('#photo').style.transform = `scale(${1.02 + .06 * a})`; $('#photobg').style.transform = `scale(${1.04 + .04 * a})`;
  for (const g of ['#ghost', '#ghost2']) $(g).style.transform = `translateX(${(g === '#ghost' ? -1 : 1) * 160 * a}px)`;
  if (S.torn) { const k = M.E.back(M.seg(t, nameAt, nameAt + .3)); const el = $('#tornname'); el.style.opacity = t >= nameAt ? 1 : 0; el.style.transform = `translateX(${(1 - k) * -80}px)`; }
  else M.reveal($('#name'), t, nameAt, { step: .06 });

  // its beat (the reference's who R09 builds over 2.5 s; ours showed all three within 0.2 s)

  const late = S.at + (S.end - S.at) * .45, rv = S.reveal, enAt = Math.min(late - .15, rv ? nameAt + rv * .45 : nameAt + .35), roleAt = Math.min(late - .25, S.roleAt ?? (rv ? nameAt + rv : nameAt + .6)), fd = rv ? .18 : .35;

if (S.face && M.FACE[S.face]) $('#name').style.fontFamily = `'${M.FACE[S.face]}', 'House Kokka'`;

M.ready([S.photo]);
</script>

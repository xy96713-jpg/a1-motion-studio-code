  document.getElementById('cam').style.filter = 'drop-shadow(3px 0 0 rgba(255,0,60,.28)) drop-shadow(-3px 0 0 rgba(0,180,255,.28)) contrast(1.06)';
  document.getElementById('bigt').style.cssText += (ONE ? '' : ';font-size:140px') + ';transform:scaleX(.86);filter:drop-shadow(4px 0 0 rgba(255,0,60,.3)) drop-shadow(-4px 0 0 rgba(0,190,255,.3))';   /* (the headline's size set above is kept: 140 px here overrode it, h800-S2 at a third of the reference) */

img.onload = () => document.fonts.ready.then(() => {
  // the one-canvas headline measured in its own font and set to about four fifths of the frame's width (1500 px on
  // screen at the opening zoom; a character-count guess left it at half: the house fonts are condensed)
  // (the text's own box, its condensing included, before the camera is set: page pixels; on screen times the zoom)
  if (ONE) { const el = document.getElementById('bigt'); el.textContent = bigBeat.text || bigBeat.phrase; el.style.fontSize = `${window.__bigF / window.__z0}px`; const r = document.createRange(); r.selectNodeContents(el);
    const onScreen = r.getBoundingClientRect().width * window.__z0; if (onScreen > 0) window.__bigF = Math.min(240, window.__bigF * 1500 / onScreen); el.style.fontSize = `${window.__bigF / window.__z0}px`; }
  window.__ready = true; render(S.at); });
window.render = (t) => {
  { const sb = (S.subs || []).find((x) => t >= x.at && t < x.end); document.getElementById('sub').textContent = sb ? sb.text : ''; }
  // the big headline: typed a character every 2 frames with a cursor, a ghost of itself shaking off, then it lifts away
  if (bigBeat) {
    const el = document.getElementById('bigt'), txt = bigBeat.text || bigBeat.phrase, n = [...txt].length;
    const k = Math.round(seg(t, bigBeat.at, bigBeat.at + n * .067) * n), out = seg(t, bigBeat.end - .3, bigBeat.end);
    const mk = bigBeat.mark || '', mi = mk ? txt.indexOf(mk) : -1;
    el.innerHTML = (mi >= 0 && k > mi ? [...txt].slice(0, mi).join('') + `<span style="position:relative">${[...txt].slice(mi, Math.min(k, mi + [...mk].length)).join('')}<i style="position:absolute;left:0;right:0;bottom:.02em;height:.3em;background:${REF ? '#1f5cf2' : TH.mark};z-index:-1;transform-origin:0 50%;transform:scaleX(${E.out(seg(t, bigBeat.at + mi * .067, bigBeat.at + (mi + [...mk].length) * .067 + .2))})"></i></span>` + [...txt].slice(mi + [...mk].length, k).join('') : [...txt].slice(0, k).join('')) + (k < n || Math.floor(t * 4) % 2 ? `<span style="display:inline-block;width:${REF ? 4 : 8}px;height:.9em;background:${REF ? TH.ink : TH.accent};vertical-align:-.1em;margin-left:6px"></span>` : '');
    if (S.treat) { el.innerHTML = `<span class="tw" style="display:inline-block">${el.innerHTML}</span>`; window.__treat(el.firstChild, S.treat); }
    if (ONE) el.style.fontSize = `${window.__bigF / window.__z0}px`;
    el.style.position = 'relative'; el.style.zIndex = 0; el.style.color = TH.ink; el.style.textShadow = `${6 * (1 - seg(t, bigBeat.at, bigBeat.at + .8))}px 0 ${TH.accent}55`;
    // one canvas: the headline fades as the camera leaves it for the body (the page is closed up, so it would otherwise

    document.getElementById('big').style.opacity = ONE ? (t >= bigBeat.at ? 1 - seg(t, bigBeat.end - .05, bigBeat.end + .45) : 0) : (t >= bigBeat.at && t < bigBeat.end ? 1 - out : 0);
    const gl = seg(t, bigBeat.end - .22, bigBeat.end); document.getElementById('big').style.transform = ONE ? `translate(0, -50%) translateX(${gl > 0 && gl < 1 ? (Math.round(t * 60) % 2 ? 6 : -5) / window.__z0 : 0}px)` : REF ? `translate(${gl > 0 ? (Math.round(t * 30) % 2 ? 14 : -10) * gl : 0}px, ${-30 * gl}px) scale(${1 - .18 * gl})` : `translateY(${-160 * out}px)`;
    if (REF) { const g2 = ONE ? (gl > 0 && gl < 1 ? 1 : 0) : gl; el.style.filter = `drop-shadow(${(4 + 20 * g2) / (ONE ? window.__z0 : 1)}px 0 0 rgba(255,0,60,.35)) drop-shadow(${-(4 + 20 * g2) / (ONE ? window.__z0 : 1)}px 0 0 rgba(0,190,255,.35))`; }
    document.getElementById('cam').style.opacity = ONE ? 1 : (t < bigBeat.end - .15 ? 0 : seg(t, bigBeat.end - .15, bigBeat.end + .1));
    if (ONE) { const mk2 = el.querySelector('i'); if (mk2) mk2.style.opacity = 1 - seg(t, bigBeat.end - .1, bigBeat.end + .15); }
  }
  const c = camAt(t); document.getElementById('cam').style.transform = `translate(${c.x}px, ${c.y}px) scale(${c.z})`;

    blur.style.webkitMaskImage = `linear-gradient(to bottom, #000 ${yc - half - fe}px, transparent ${yc - half}px, transparent ${yc + half}px, #000 ${yc + half + fe}px)`;
    blur.style.webkitMaskSize = `${PW}px ${PH}px`; blur.style.webkitMaskRepeat = 'no-repeat'; blur.style.opacity = 1;
    const half2 = 250 / c.z, fe2 = 220 / c.z;

    blur2.style.webkitMaskSize = `${PW}px ${PH}px`; blur2.style.webkitMaskRepeat = 'no-repeat'; blur2.style.opacity = blur.style.opacity; }
  for (const b of beats) {
    if (b.co) { const on = t >= b.at + .1 && t < b.end + .05, n = b.co.txt.length, ch = Math.round(seg(t, b.at + .15, b.at + .15 + n * .06) * n);
      b.co.el.style.display = on ? 'block' : 'none'; b.co.el.style.transform = `scale(${1 + .07 * E.inout(seg(t, b.at + .15, b.end))})`;   /* (it keeps pushing in once typed, as the reference's) */ b.co.el.querySelector('.ct').textContent = b.co.txt.slice(0, ch).join('');
      const cb = b.co.el.querySelector('.cb'), w = b.co.el.querySelector('.ct').getBoundingClientRect().width; cb.style.width = `${w + 40}px`; cb.style.transform = `scaleX(${E.out(seg(t, b.at + .1, b.at + .45))})`; continue; }

      const nx = beats.find((x) => x.do === 'highlight' && !x.big && x.at > b.at), o = nx ? 1 - seg(t, nx.at + .1, nx.at + .5) : 1;

    }
  }
